name: Persist validated adaptive v2

on:
  push:
    branches: [adaptive-v2-working]
    paths:
      - .github/workflows/adaptive-v2-persist.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-v2-working
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reuse the validated integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/adaptive-v2-validate-fixed.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == '- name: Integrate behavioral learning')
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].startswith('      - name:'))
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/adaptive-v2-integrate.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/adaptive-v2-integrate.sh
      - name: Install dependencies
        run: npm ci
      - name: Validate product
        run: |
          npm audit --omit=dev --audit-level=high
          npx eslint src/components/StartHereAppV2.tsx src/components/ActiveWorkoutExperience.tsx src/lib/startHereModels.ts src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereBehavior.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts
          npm test
          npm run build
      - name: Commit product changes only
        run: |
          git config user.name "Squiggs07"
          git config user.email "160694990+Squiggs07@users.noreply.github.com"
          git add src/components/StartHereAppV2.tsx src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts src/lib/startHerePlan.test.ts src/lib/startHereAdaptation.test.ts
          git commit -m "Integrate adaptive behavior learning v2"
          git push origin HEAD:adaptive-v2-working
