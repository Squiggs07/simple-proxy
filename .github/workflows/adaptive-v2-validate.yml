name: Validate adaptive behavior v2

on:
  push:
    branches: [adaptive-v2-working]
    paths:
      - .github/workflows/adaptive-v2-validate.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-v2-working
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Integrate behavioral learning
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          app = "src/components/StartHereAppV2.tsx"
          replace(app,
              'import { buildAdaptationReview, type AdaptationRecommendation } from "@/lib/startHereAdaptation";',
              'import { buildAdaptationReview, progressionCue, type AdaptationRecommendation } from "@/lib/startHereAdaptation";')
          replace(app,
              '  currentTargets,\n  mealFamilyKey,',
              '  currentTargets,\n  exercisePreviousPerformance,\n  mealFamilyKey,')
          replace(app,
              '''        const saved = localStorage.getItem("start-here-state-v7") ?? localStorage.getItem("start-here-state-v6") ?? localStorage.getItem("start-here-state-v5") ?? localStorage.getItem("start-here-state-v4") ?? localStorage.getItem("start-here-state-v3");''',
              '''        const saved = localStorage.getItem("start-here-state-v8") ?? localStorage.getItem("start-here-state-v7") ?? localStorage.getItem("start-here-state-v6") ?? localStorage.getItem("start-here-state-v5") ?? localStorage.getItem("start-here-state-v4") ?? localStorage.getItem("start-here-state-v3");''')
          replace(app,
              '    if (ready) localStorage.setItem("start-here-state-v7", JSON.stringify(state));',
              '    if (ready) localStorage.setItem("start-here-state-v8", JSON.stringify(state));')
          replace(app,
              '''        const alt = exerciseSwaps[item.exercise.id] ? allAlternatives.get(exerciseSwaps[item.exercise.id]) : undefined;\n        return alt ? { ...item, exercise: alt } : item;''',
              '''        const replacementId = exerciseSwaps[item.sourceExerciseId];\n        const alt = replacementId ? allAlternatives.get(replacementId) : undefined;\n        return alt ? {\n          ...item,\n          exercise: alt,\n          previous: exercisePreviousPerformance(state, alt.id),\n          progression: progressionCue(state, alt.id),\n        } : item;''')
          replace(app,
              '''  function swapMeal(sourceMealId: string, replacement: Meal) {\n    patch({ swappedMealIds: { ...state.swappedMealIds, [sourceMealId]: replacement.id } });\n    setSwapMealId(null);\n  }''',
              '''  function swapMeal(sourceMealId: string, replacement: Meal) {\n    const date = todayKey();\n    const currentMealId = state.swappedMealIds[sourceMealId] ?? sourceMealId;\n    patch({\n      swappedMealIds: { ...state.swappedMealIds, [sourceMealId]: replacement.id },\n      mealSwapLogs: [...state.mealSwapLogs, { date, sourceMealId: currentMealId, chosenMealId: replacement.id }],\n    });\n    setSwapMealId(null);\n  }''')
          replace(app,
              '''  function applyAdaptiveRecommendation(recommendation: AdaptationRecommendation) {\n    setUndoSnapshot(state);\n    const coachMessage = {\n      id: `coach-adapt-${Date.now()}`,\n      role: "coach" as const,\n      text: `I adapted the plan: ${recommendation.title}. ${recommendation.reason}`,\n      changeSummary: recommendation.title,\n      createdAt: new Date().toISOString(),\n    };\n    setState((current) => ({ ...current, ...recommendation.patch, coachHistory: [...current.coachHistory, coachMessage] }));\n  }''',
              '''  function applyAdaptiveRecommendation(recommendation: AdaptationRecommendation) {\n    setUndoSnapshot(state);\n    const date = todayKey();\n    const coachMessage = {\n      id: `coach-adapt-${Date.now()}`,\n      role: "coach" as const,\n      text: `I adapted the plan: ${recommendation.title}. ${recommendation.reason}`,\n      changeSummary: recommendation.title,\n      createdAt: new Date().toISOString(),\n    };\n    const event = { id: `${recommendation.id}-${Date.now()}`, date, kind: recommendation.kind, title: recommendation.title };\n    setState((current) => ({\n      ...current,\n      ...recommendation.patch,\n      adaptationEvents: [...current.adaptationEvents, event],\n      coachHistory: [...current.coachHistory, coachMessage],\n    }));\n  }''')
          replace(app,
              '''  function startWorkout() {\n    setActiveWorkout(true);\n  }\n\n  function finishWorkout''',
              '''  function startWorkout() {\n    setActiveWorkout(true);\n  }\n\n  function swapExercise(slotExerciseId: string, currentExerciseId: string, replacementId: string) {\n    const date = todayKey();\n    setExerciseSwaps((current) => ({ ...current, [slotExerciseId]: replacementId }));\n    setState((current) => ({\n      ...current,\n      exerciseSwapLogs: [...current.exerciseSwapLogs, { date, sourceExerciseId: currentExerciseId, chosenExerciseId: replacementId }],\n    }));\n  }\n\n  function finishWorkout''')
          replace(app,
              '        onSwap={(exerciseId, replacementId) => setExerciseSwaps((current) => ({ ...current, [exerciseId]: replacementId }))}',
              '        onSwap={swapExercise}')
          replace(app,
              'reset={() => { localStorage.removeItem("start-here-state-v7");',
              'reset={() => { localStorage.removeItem("start-here-state-v8"); localStorage.removeItem("start-here-state-v7");')

          active = "src/components/ActiveWorkoutExperience.tsx"
          replace(active,
              '  onSwap: (exerciseId: string, replacementId: string) => void;',
              '  onSwap: (slotExerciseId: string, currentExerciseId: string, replacementId: string) => void;')
          replace(active,
              '''  const selected = swapFor ? workout.exercises.find((item) => item.exercise.id === swapFor) : undefined;''',
              '''  const selected = swapFor ? workout.exercises.find((item) => item.exercise.id === swapFor) : undefined;''')
          replace(active,
              '''  function toggleComplete(exerciseId: string, index: number) {\n    const current = drafts[exerciseId]?.[index];\n    const nextComplete = !current?.complete;\n    updateSet(exerciseId, index, { complete: nextComplete });\n    if (nextComplete) setRestSeconds(90);\n  }''',
              '''  function toggleComplete(exerciseId: string, index: number) {\n    const current = drafts[exerciseId]?.[index];\n    const nextComplete = !current?.complete;\n    updateSet(exerciseId, index, { complete: nextComplete });\n    if (nextComplete) setRestSeconds(90);\n  }\n\n  useEffect(() => {\n    setDrafts((current) => {\n      const next = { ...current };\n      let changed = false;\n      for (const item of workout.exercises) {\n        if (!next[item.exercise.id]) {\n          next[item.exercise.id] = Array.from({ length: item.sets }, () => ({ weight: "", reps: "", complete: false }));\n          changed = true;\n        }\n      }\n      return changed ? next : current;\n    });\n  }, [workout]);''')
          replace(active,
              '''                <button key={alt.id} onClick={() => { onSwap(selected.exercise.id, alt.id); setSwapFor(null); }} className="swap-option">''',
              '''                <button key={alt.id} onClick={() => { onSwap(selected.sourceExerciseId, selected.exercise.id, alt.id); setSwapFor(null); }} className="swap-option">''')

          plan = "src/lib/startHerePlan.ts"
          replace(plan,
              'import { progressionCue } from "@/lib/startHereAdaptation";\n',
              'import { progressionCue } from "@/lib/startHereAdaptation";\nimport { exerciseBehaviorScore, mealBehaviorScore } from "@/lib/startHereBehavior";\n')
          replace(plan,
              '''export interface WorkoutExercise {\n  exercise: Exercise;''',
              '''export interface WorkoutExercise {\n  sourceExerciseId: string;\n  exercise: Exercise;''')
          replace(plan,
              '''      if (mealContains(meal, state.dislikes)) score -= 6;\n      return { meal, score, reasons };''',
              '''      if (mealContains(meal, state.dislikes)) score -= 6;\n      const learned = mealBehaviorScore(state, meal);\n      score += learned.score;\n      reasons.push(...learned.reasons);\n      return { meal, score, reasons };''')
          replace(plan,
              '''function previousPerformance(state: AppState, exerciseId: string) {''',
              '''export function exercisePreviousPerformance(state: AppState, exerciseId: string) {''')
          replace(plan,
              '''    const candidates = EXERCISES.filter((exercise) =>\n      exercise.pattern === pattern &&\n      equipmentMatches(exercise, equipment) &&\n      !exerciseBlocked(exercise, state) &&\n      (!nervousBeginner || exercise.beginnerFriendly) &&\n      (!olderBeginner || exercise.stable),\n    );\n    const preferred = candidates.find((exercise) => includesLoose(state.preferredExercises, exercise.name));\n    const exercise = preferred ?? candidates[0];''',
              '''    const candidates = EXERCISES.filter((exercise) =>\n      exercise.pattern === pattern &&\n      equipmentMatches(exercise, equipment) &&\n      !exerciseBlocked(exercise, state) &&\n      (!nervousBeginner || exercise.beginnerFriendly) &&\n      (!olderBeginner || exercise.stable),\n    ).sort((a, b) => {\n      const explicitA = includesLoose(state.preferredExercises, a.name) ? 20 : 0;\n      const explicitB = includesLoose(state.preferredExercises, b.name) ? 20 : 0;\n      const focusA = a.focus.filter((focus) => includesLoose(state.focusAreas, focus)).length * 3;\n      const focusB = b.focus.filter((focus) => includesLoose(state.focusAreas, focus)).length * 3;\n      return (explicitB + focusB + exerciseBehaviorScore(state, b).score) - (explicitA + focusA + exerciseBehaviorScore(state, a).score);\n    });\n    const exercise = candidates[0];''')
          replace(plan,
              '''    for (const exercise of EXERCISES) {\n      if (equipmentMatches(exercise, equipment) && !exerciseBlocked(exercise, state) && !chosen.some((item) => item.id === exercise.id)) {\n        chosen.push(exercise);\n      }\n      if (chosen.length >= maxExercises) break;\n    }''',
              '''    const fallbackCandidates = EXERCISES\n      .filter((exercise) => equipmentMatches(exercise, equipment) && !exerciseBlocked(exercise, state) && !chosen.some((item) => item.id === exercise.id))\n      .sort((a, b) => exerciseBehaviorScore(state, b).score - exerciseBehaviorScore(state, a).score);\n    for (const exercise of fallbackCandidates) {\n      chosen.push(exercise);\n      if (chosen.length >= maxExercises) break;\n    }''')
          replace(plan,
              '''    exercises: chosen.slice(0, maxExercises).map((exercise, index) => ({\n      exercise,''',
              '''    exercises: chosen.slice(0, maxExercises).map((exercise, index) => ({\n      sourceExerciseId: exercise.id,\n      exercise,''')
          replace(plan,
              '      previous: previousPerformance(state, exercise.id),',
              '      previous: exercisePreviousPerformance(state, exercise.id),')
          replace(plan,
              '''  return [...direct, ...others]\n    .filter((item, index, array) => array.findIndex((candidate) => candidate.id === item.id) === index)\n    .filter((item) => equipmentMatches(item, equipment) && !exerciseBlocked(item, state))\n    .slice(0, 4);''',
              '''  const directIds = new Set(direct.map((item) => item.id));\n  return [...direct, ...others]\n    .filter((item, index, array) => array.findIndex((candidate) => candidate.id === item.id) === index)\n    .filter((item) => equipmentMatches(item, equipment) && !exerciseBlocked(item, state))\n    .sort((a, b) => {\n      const learned = exerciseBehaviorScore(state, b).score - exerciseBehaviorScore(state, a).score;\n      if (learned !== 0) return learned;\n      return Number(directIds.has(b.id)) - Number(directIds.has(a.id));\n    })\n    .slice(0, 4);''')

          adaptation = "src/lib/startHereAdaptation.ts"
          replace(adaptation,
              '''function recentOngoingAdaptation(state: AppState, today: string, cooldownDays = 7) {\n  const cutoff = daysAgo(today, cooldownDays - 1);\n  return state.coachHistory.some((message) =>\n    message.role === "coach" &&\n    message.text.startsWith("I adapted the plan:") &&\n    message.createdAt.slice(0, 10) >= cutoff,\n  );\n}''',
              '''function recentOngoingAdaptation(state: AppState, today: string, cooldownDays = 7) {\n  const cutoff = daysAgo(today, cooldownDays - 1);\n  if (state.adaptationEvents.some((event) => event.kind !== "recovery" && event.date >= cutoff && event.date <= today)) return true;\n  return state.coachHistory.some((message) =>\n    message.role === "coach" &&\n    message.text.startsWith("I adapted the plan:") &&\n    message.createdAt.slice(0, 10) >= cutoff,\n  );\n}''')
          replace(adaptation,
              '''export function latestReadiness(state: AppState, today: string): ReadinessCheckIn | null {\n  return [...state.readinessCheckIns].reverse().find((item) => item.date === today) ?? null;\n}\n\nexport function workoutAdherence''',
              '''export function latestReadiness(state: AppState, today: string): ReadinessCheckIn | null {\n  return [...state.readinessCheckIns].reverse().find((item) => item.date === today) ?? null;\n}\n\nexport function readinessLowRate(state: AppState, today: string, windowDays = 10): number | null {\n  const cutoff = daysAgo(today, windowDays - 1);\n  const checkIns = state.readinessCheckIns.filter((item) => item.date >= cutoff && item.date <= today);\n  if (checkIns.length < 5) return null;\n  return checkIns.filter((item) => item.readiness === "low").length / checkIns.length;\n}\n\nexport function workoutAdherence''')
          replace(adaptation,
              '''  mealAdherence: number | null;\n  recommendations: AdaptationRecommendation[];''',
              '''  mealAdherence: number | null;\n  readinessLowRate: number | null;\n  recommendations: AdaptationRecommendation[];''')
          replace(adaptation,
              '''  const mealRate = mealAdherence(state, today);\n  const recommendations: AdaptationRecommendation[] = [];''',
              '''  const mealRate = mealAdherence(state, today);\n  const lowReadinessRate = readinessLowRate(state, today);\n  const recommendations: AdaptationRecommendation[] = [];''')
          replace(adaptation,
              '''  const coolingDown = recentOngoingAdaptation(state, today);\n  if (!coolingDown && workoutRate !== null && workoutRate < 0.6 && state.trainingDays > 1) {\n    recommendations.push({\n      id: "schedule-less-often",\n      kind: "schedule",\n      scope: "ongoing",\n      title: `Try ${state.trainingDays - 1} training days instead of ${state.trainingDays}`,\n      reason: "Your recent completed-workout rate is below the schedule you chose. A smaller plan you complete is more useful than a larger plan you keep missing.",\n      confidence: "moderate",\n      patch: { trainingDays: state.trainingDays - 1 },\n    });\n  }\n\n  if (!coolingDown) {\n    const nutrition = nutritionRecommendation(state, mealRate);\n    if (nutrition) recommendations.push(nutrition);\n  }\n\n  return { latestReadiness: readiness, workoutAdherence: workoutRate, mealAdherence: mealRate, recommendations };''',
              '''  const coolingDown = recentOngoingAdaptation(state, today);\n  if (!coolingDown && lowReadinessRate !== null && lowReadinessRate >= 0.5 && workoutRate !== null && workoutRate < 0.8 && state.sessionMinutes > 20) {\n    const shorter = Math.max(20, state.sessionMinutes - 10);\n    recommendations.push({\n      id: "recovery-shorter-baseline",\n      kind: "recovery",\n      scope: "ongoing",\n      title: `Make normal sessions ${shorter} minutes for now`,\n      reason: "Low-readiness check-ins have become a pattern and workout completion is also below plan. Shortening the normal session is a smaller change than cutting a training day and is easy to reverse.",\n      confidence: "moderate",\n      patch: { sessionMinutes: shorter },\n    });\n  } else if (!coolingDown && workoutRate !== null && workoutRate < 0.6 && state.trainingDays > 1) {\n    recommendations.push({\n      id: "schedule-less-often",\n      kind: "schedule",\n      scope: "ongoing",\n      title: `Try ${state.trainingDays - 1} training days instead of ${state.trainingDays}`,\n      reason: "Your recent completed-workout rate is below the schedule you chose. A smaller plan you complete is more useful than a larger plan you keep missing.",\n      confidence: "moderate",\n      patch: { trainingDays: state.trainingDays - 1 },\n    });\n  }\n\n  if (!coolingDown && !recommendations.some((item) => item.scope === "ongoing")) {\n    const nutrition = nutritionRecommendation(state, mealRate);\n    if (nutrition) recommendations.push(nutrition);\n  }\n\n  return { latestReadiness: readiness, workoutAdherence: workoutRate, mealAdherence: mealRate, readinessLowRate: lowReadinessRate, recommendations };''')

          client = "src/lib/startHereCoachClient.ts"
          replace(client,
              'import { buildAdaptationReview } from "@/lib/startHereAdaptation";\n',
              'import { buildAdaptationReview } from "@/lib/startHereAdaptation";\nimport { learnedBehaviorSignals } from "@/lib/startHereBehavior";\n')
          replace(client,
              '''  const adaptation = buildAdaptationReview(state, state.currentDay || new Date().toISOString().slice(0, 10));\n\n  try {''',
              '''  const adaptation = buildAdaptationReview(state, state.currentDay || new Date().toISOString().slice(0, 10));\n  const learnedBehavior = learnedBehaviorSignals(state);\n\n  try {''')
          replace(client,
              '''          mealAdherence: adaptation.mealAdherence,\n        },''',
              '''          mealAdherence: adaptation.mealAdherence,\n          readinessLowRate: adaptation.readinessLowRate,\n          learnedBehavior,\n        },''')

          route = "src/app/api/start-here-coach/route.ts"
          replace(route,
              '''    mealAdherence: z.number().min(0).max(1).nullable(),\n  }),''',
              '''    mealAdherence: z.number().min(0).max(1).nullable(),\n    readinessLowRate: z.number().min(0).max(1).nullable(),\n    learnedBehavior: z.array(z.string().max(180)).max(6),\n  }),''')
          replace(route,
              '''The context may include today's readiness plus recent workout and meal adherence; use those signals when helpful, but do not overreact to one day. Be plainspoken, practical, and nuanced.''',
              '''The context may include today's readiness, recent workout and meal adherence, a multi-day low-readiness rate, and learnedBehavior derived from repeated in-app choices. Use those signals when helpful, but do not overreact to one day. Treat learnedBehavior as observed tendencies rather than permanent facts; an explicit current request always overrides an inferred preference. Be plainspoken, practical, and nuanced.''')

          plan_test = "src/lib/startHerePlan.test.ts"
          replace(plan_test,
              '''  it("builds a shorter workout from a today-only time override", () => {''',
              '''  it("raises meals the user repeatedly chooses through swaps", () => {\n    const learnedState = {\n      ...INITIAL_STATE,\n      currentDay: "2026-08-17",\n      likedFoods: [],\n      cuisines: [],\n      mealFormats: [],\n      mealSwapLogs: [\n        { date: "2026-08-10", sourceMealId: "turkey-pesto-pasta", chosenMealId: "salmon-potato-plate" },\n        { date: "2026-08-15", sourceMealId: "steak-taco-bowl", chosenMealId: "salmon-potato-plate" },\n      ],\n    };\n    const learned = rankMeals(learnedState).find((item) => item.meal.id === "salmon-potato-plate")!;\n    const baseline = rankMeals({ ...learnedState, mealSwapLogs: [] }).find((item) => item.meal.id === "salmon-potato-plate")!;\n    expect(learned.score).toBeGreaterThan(baseline.score);\n    expect(learned.reasons.join(" ")).toContain("repeatedly");\n  });\n\n  it("learns repeated exercise replacements when building future workouts", () => {\n    const state = {\n      ...INITIAL_STATE,\n      currentDay: "2026-08-17",\n      experience: "experienced" as const,\n      liftingHistory: "consistent" as const,\n      confidence: "comfortable" as const,\n      exerciseSwapLogs: [\n        { date: "2026-08-10", sourceExerciseId: "reverse-lunge", chosenExerciseId: "step-up" },\n        { date: "2026-08-15", sourceExerciseId: "reverse-lunge", chosenExerciseId: "step-up" },\n      ],\n    };\n    const workout = buildWorkout(state);\n    expect(workout.exercises.some((item) => item.exercise.id === "step-up")).toBe(true);\n    expect(workout.exercises.some((item) => item.exercise.id === "reverse-lunge")).toBe(false);\n  });\n\n  it("builds a shorter workout from a today-only time override", () => {''')

          adaptation_test = "src/lib/startHereAdaptation.test.ts"
          replace(adaptation_test,
              '''  it("recognizes repeated top-of-range performance as a progression signal", () => {''',
              '''  it("uses repeated low readiness plus missed workouts to suggest a smaller normal session", () => {\n    const current = state({\n      trainingDays: 4,\n      sessionMinutes: 50,\n      readinessCheckIns: [\n        { date: "2026-08-09", readiness: "low" },\n        { date: "2026-08-11", readiness: "low" },\n        { date: "2026-08-13", readiness: "normal" },\n        { date: "2026-08-15", readiness: "low" },\n        { date: "2026-08-17", readiness: "normal" },\n      ],\n      workoutLogs: [\n        { id: "w1", date: "2026-08-08", workoutName: "A", minutes: 50, exercises: [], completed: true },\n        { id: "w2", date: "2026-08-15", workoutName: "A", minutes: 50, exercises: [], completed: true },\n      ],\n    });\n    const ongoing = buildAdaptationReview(current, "2026-08-17").recommendations.find((item) => item.scope === "ongoing");\n    expect(ongoing?.kind).toBe("recovery");\n    expect(ongoing?.patch.sessionMinutes).toBe(40);\n  });\n\n  it("does not stack ongoing adaptations during the cooldown window", () => {\n    const current = state({\n      trainingDays: 4,\n      adaptationEvents: [{ id: "prior", date: "2026-08-15", kind: "schedule", title: "Changed schedule" }],\n      workoutLogs: [{ id: "w1", date: "2026-08-10", workoutName: "A", minutes: 40, exercises: [], completed: true }],\n    });\n    expect(buildAdaptationReview(current, "2026-08-17").recommendations.some((item) => item.scope === "ongoing")).toBe(false);\n  });\n\n  it("recognizes repeated top-of-range performance as a progression signal", () => {''')

          ci = ".github/workflows/start-here-ci.yml"
          replace(ci,
              '''src/lib/startHerePlan.ts src/lib/startHereCoach.ts src/lib/startHereCoachClient.ts''',
              '''src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereBehavior.ts src/lib/startHereCoach.ts src/lib/startHereCoachClient.ts''')
          PY

      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint product code
        run: npx eslint src/components/StartHereAppV2.tsx src/components/ActiveWorkoutExperience.tsx src/lib/startHereModels.ts src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereBehavior.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "Squiggs07"
          git config user.email "160694990+Squiggs07@users.noreply.github.com"
          git add src/components/StartHereAppV2.tsx src/components/ActiveWorkoutExperience.tsx src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts src/lib/startHerePlan.test.ts src/lib/startHereAdaptation.test.ts .github/workflows/start-here-ci.yml
          git commit -m "Integrate adaptive behavior learning v2"
          git push origin HEAD:adaptive-v2-working
