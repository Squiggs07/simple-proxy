name: Start Here Coach Client Integration

on:
  push:
    branches:
      - start-here/lovable-transfer

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-here/lovable-transfer

      - name: Wire resilient semantic Coach client
        shell: python
        run: |
          from pathlib import Path
          path = Path("start-here/src/components/StartHereAppV2.tsx")
          text = path.read_text()

          import_anchor = 'import { interpretCoachRequest } from "@/lib/startHereCoach";\n'
          text = text.replace(import_anchor, import_anchor + 'import { canonicalizeCoachRequest } from "@/lib/startHereCoachClient";\n', 1)

          text = text.replace(
              '  const [coachText, setCoachText] = useState("");\n  const [undoSnapshot, setUndoSnapshot] = useState<AppState | null>(null);',
              '  const [coachText, setCoachText] = useState("");\n  const [coachBusy, setCoachBusy] = useState(false);\n  const [undoSnapshot, setUndoSnapshot] = useState<AppState | null>(null);',
              1,
          )

          old_handler = "\n".join([
              '  function handleCoach(event: FormEvent) {',
              '    event.preventDefault();',
              '    const raw = coachText.trim();',
              '    if (!raw) return;',
              '    const result = interpretCoachRequest(raw, state);',
              '    const changed = Object.keys(result.patch).length > 0;',
              '    if (changed) setUndoSnapshot(state);',
              '    const now = new Date().toISOString();',
              '    const nextHistory = [',
              '      ...state.coachHistory,',
              '      { id: `user-${Date.now()}`, role: "user" as const, text: raw, createdAt: now },',
              '      { id: `coach-${Date.now() + 1}`, role: "coach" as const, text: result.reply, changeSummary: result.changeSummary, createdAt: now },',
              '    ];',
              '    setState((current) => ({ ...current, ...result.patch, coachHistory: nextHistory }));',
              '    setCoachText("");',
              '  }',
          ])
          new_handler = "\n".join([
              '  async function handleCoach(event: FormEvent) {',
              '    event.preventDefault();',
              '    const raw = coachText.trim();',
              '    if (!raw || coachBusy) return;',
              '',
              '    const snapshot = state;',
              '    const now = new Date().toISOString();',
              '    const userMessage = { id: `user-${Date.now()}`, role: "user" as const, text: raw, createdAt: now };',
              '    setCoachText("");',
              '    setCoachBusy(true);',
              '    setState((current) => ({ ...current, coachHistory: [...current.coachHistory, userMessage] }));',
              '',
              '    try {',
              '      const canonical = await canonicalizeCoachRequest(raw, snapshot, targets);',
              '      const result = interpretCoachRequest(canonical, snapshot);',
              '      const changed = Object.keys(result.patch).length > 0;',
              '      if (changed) setUndoSnapshot(snapshot);',
              '      const coachMessage = {',
              '        id: `coach-${Date.now() + 1}`,',
              '        role: "coach" as const,',
              '        text: result.reply,',
              '        changeSummary: result.changeSummary,',
              '        createdAt: new Date().toISOString(),',
              '      };',
              '      setState((current) => ({ ...current, ...result.patch, coachHistory: [...current.coachHistory, coachMessage] }));',
              '    } finally {',
              '      setCoachBusy(false);',
              '    }',
              '  }',
          ])
          if old_handler not in text:
              raise SystemExit("Coach handler block not found")
          text = text.replace(old_handler, new_handler, 1)

          old_call = '<CoachView state={state} targets={targets} coachText={coachText} setCoachText={setCoachText} submit={handleCoach} canUndo={Boolean(undoSnapshot)} undo={undoCoach} />'
          new_call = '<CoachView state={state} targets={targets} coachText={coachText} setCoachText={setCoachText} submit={handleCoach} busy={coachBusy} canUndo={Boolean(undoSnapshot)} undo={undoCoach} />'
          if old_call not in text:
              raise SystemExit("CoachView call not found")
          text = text.replace(old_call, new_call, 1)

          old_signature = 'function CoachView({ state, targets, coachText, setCoachText, submit, canUndo, undo }: { state: AppState; targets: ReturnType<typeof currentTargets>; coachText: string; setCoachText: (value: string) => void; submit: (event: FormEvent) => void; canUndo: boolean; undo: () => void }) {'
          new_signature = 'function CoachView({ state, targets, coachText, setCoachText, submit, busy, canUndo, undo }: { state: AppState; targets: ReturnType<typeof currentTargets>; coachText: string; setCoachText: (value: string) => void; submit: (event: FormEvent) => void | Promise<void>; busy: boolean; canUndo: boolean; undo: () => void }) {'
          if old_signature not in text:
              raise SystemExit("CoachView signature not found")
          text = text.replace(old_signature, new_signature, 1)

          text = text.replace(
              '<div className="mt-5 space-y-3">{state.coachHistory.slice(-8).map((message) => <div key={message.id}',
              '<div className="mt-5 space-y-3">{state.coachHistory.slice(-8).map((message) => <div key={message.id}',
              1,
          )
          history_end = '</div></div></div>)}</div>\n    <div className="mt-4 flex flex-wrap gap-2">'
          history_replacement = '</div></div></div>)}{busy && <div className="coach-message coach-assistant"><div className="flex items-center gap-2.5"><span className="coach-mark"><Icon name="spark" size={14} /></span><p className="text-[#68736F]">Understanding what you want to change…</p></div></div>}</div>\n    <div className="mt-4 flex flex-wrap gap-2">'
          if history_end not in text:
              raise SystemExit("Coach history end not found")
          text = text.replace(history_end, history_replacement, 1)

          text = text.replace(
              '{suggestions.map((suggestion) => <button key={suggestion} onClick={() => setCoachText(suggestion)} className="suggestion-chip">{suggestion}</button>)}',
              '{suggestions.map((suggestion) => <button key={suggestion} disabled={busy} onClick={() => setCoachText(suggestion)} className="suggestion-chip disabled:opacity-45">{suggestion}</button>)}',
              1,
          )
          old_form = '<form onSubmit={submit} className="coach-composer"><textarea rows={3} value={coachText} onChange={(e) => setCoachText(e.target.value)} placeholder="Try: From now on I can train 3 days for 30 minutes..." /><div className="mt-2 flex items-center justify-between"><p className="text-[10px] leading-4 text-[#8B938F]">Changes use deterministic targets and guardrails.</p><button className="send-button" type="submit" aria-label="Send"><Icon name="arrow" size={18} /></button></div></form>'
          new_form = '<form onSubmit={submit} className="coach-composer"><textarea disabled={busy} rows={3} value={coachText} onChange={(e) => setCoachText(e.target.value)} placeholder="Try: From now on I can train 3 days for 30 minutes..." /><div className="mt-2 flex items-center justify-between"><p className="text-[10px] leading-4 text-[#8B938F]">Natural language is normalized first; deterministic rules apply every change.</p><button disabled={busy || !coachText.trim()} className="send-button disabled:cursor-not-allowed disabled:opacity-40" type="submit" aria-label="Send"><Icon name="arrow" size={18} /></button></div></form>'
          if old_form not in text:
              raise SystemExit("Coach form not found")
          text = text.replace(old_form, new_form, 1)

          path.write_text(text)

      - name: Commit integration
        run: |
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add start-here/src/components/StartHereAppV2.tsx
          git commit -m "Integrate semantic Coach fallback into Start Here UI"
          git push origin HEAD:start-here/lovable-transfer
