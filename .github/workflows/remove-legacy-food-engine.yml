name: Remove Legacy Food Engine

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/remove-legacy-food-engine.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Remove unused database food engine
        run: rm -rf src/lib/meal-engine src/lib/food.ts src/lib/food.test.ts src/lib/fdc.ts src/lib/seed-foods.ts
      - name: Commit cleanup
        run: |
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused database food engine"
          git push origin HEAD:dev
