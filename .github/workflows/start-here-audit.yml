name: Start Here Dependency Audit

on:
  push:
    branches:
      - start-here/lovable-transfer

jobs:
  audit-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: start-here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: start-here/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev || true
