name: Start Here Integrate Meal Library

on:
  push:
    branches:
      - start-here/lovable-transfer

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-here/lovable-transfer

      - name: Use complete meal library
        shell: python
        run: |
          from pathlib import Path

          plan = Path("start-here/src/lib/startHerePlan.ts")
          text = plan.read_text()
          text = text.replace("MEALS", "ALL_MEALS")
          text = text.replace(
              'import { EXERCISES, ALL_MEALS, mealMacros, type Exercise, type Meal } from "@/lib/startHereCatalog";',
              'import { EXERCISES, mealMacros, type Exercise, type Meal } from "@/lib/startHereCatalog";\nimport { ALL_MEALS } from "@/lib/startHereMealLibrary";'
          )
          plan.write_text(text)

          app = Path("start-here/src/components/StartHereAppV2.tsx")
          text = app.read_text()
          text = text.replace("MEALS", "ALL_MEALS")
          text = text.replace(
              'import { ALL_MEALS, mealMacros, type Exercise, type Meal } from "@/lib/startHereCatalog";',
              'import { mealMacros, type Exercise, type Meal } from "@/lib/startHereCatalog";\nimport { ALL_MEALS } from "@/lib/startHereMealLibrary";'
          )
          app.write_text(text)

      - name: Commit integration if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add start-here/src/lib/startHerePlan.ts start-here/src/components/StartHereAppV2.tsx
          git commit -m "Use complete Start Here meal library"
          git push origin HEAD:start-here/lovable-transfer
