name: Remove Start Here Legacy Surface

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/remove-start-here-legacy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove unused auth database and legacy page surface
        run: |
          rm -rf prisma
          rm -f src/auth.ts src/lib/db.ts src/components/AuthForm.tsx
          rm -rf src/types
          rm -rf src/app/api/auth src/app/api/meals src/app/api/onboarding src/app/api/plan src/app/api/progress src/app/api/signup src/app/api/weighin
          rm -rf src/app/onboarding src/app/plan src/app/progress src/app/signin src/app/signup src/app/summary
          rm -f src/components/DayPlan.tsx src/components/Disclaimer.tsx src/components/OnboardingWizard.tsx src/components/ProgressView.tsx src/components/StartHereApp.tsx src/components/WeightChart.tsx

      - name: Remove unused backend packages and scripts
        run: |
          npm uninstall @prisma/client prisma bcryptjs next-auth
          npm pkg delete scripts.db:migrate scripts.db:seed scripts.postinstall prisma

      - name: Commit cleanup
        run: |
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused Prisma auth and legacy app surface"
          git push origin HEAD:dev
