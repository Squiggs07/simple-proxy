name: Start Here CI

on:
  push:
    branches:
      - start-here/lovable-transfer
  workflow_dispatch:

concurrency:
  group: start-here-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-start-here:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: start-here
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: start-here/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint Start Here product code
        run: npx eslint src/components/StartHereAppV2.tsx src/components/ActiveWorkoutExperience.tsx src/components/TodayMealRow.tsx src/components/MealPortionControl.tsx src/components/WeightLogSheet.tsx src/components/MonthlySummarySheet.tsx src/lib/startHereEngine.ts src/lib/startHereModels.ts src/lib/startHereCatalog.ts src/lib/startHereMealLibrary.ts src/lib/startHerePlan.ts src/lib/startHereCoach.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts

      - name: Test planning logic
        run: npm test

      - name: Production build
        run: npm run build
