name: Start Here Feedback UI Integration

on:
  push:
    branches:
      - start-here/lovable-transfer

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-here/lovable-transfer

      - name: Integrate feedback UI
        shell: python
        run: |
          from pathlib import Path
          path = Path("start-here/src/components/StartHereAppV2.tsx")
          text = path.read_text()

          anchor = 'import { ActiveWorkoutExperience } from "@/components/ActiveWorkoutExperience";\n'
          additions = "\n".join([
              'import { ActiveWorkoutExperience } from "@/components/ActiveWorkoutExperience";',
              'import { MealPortionControl } from "@/components/MealPortionControl";',
              'import { MonthlySummarySheet } from "@/components/MonthlySummarySheet";',
              'import { TodayMealRow } from "@/components/TodayMealRow";',
              'import { WeightLogSheet } from "@/components/WeightLogSheet";',
              ''
          ])
          text = text.replace(anchor, additions, 1)
          text = text.replace('  type Experience,\n  type Variety,', '  type Experience,\n  type MealPortion,\n  type Variety,')

          text = text.replace(
              '  const [showPrep, setShowPrep] = useState(false);\n  const [activeWorkout, setActiveWorkout] = useState(false);',
              '  const [showPrep, setShowPrep] = useState(false);\n  const [showWeightLog, setShowWeightLog] = useState(false);\n  const [showMonthlySummary, setShowMonthlySummary] = useState(false);\n  const [activeWorkout, setActiveWorkout] = useState(false);'
          )

          text = text.replace(
              '        const saved = localStorage.getItem("start-here-state-v3");',
              '        const saved = localStorage.getItem("start-here-state-v4") ?? localStorage.getItem("start-here-state-v3");'
          )
          text = text.replace(
              '    if (ready) localStorage.setItem("start-here-state-v3", JSON.stringify(state));',
              '    if (ready) localStorage.setItem("start-here-state-v4", JSON.stringify(state));'
          )

          text = text.replace(
              '  const progressReview = useMemo(() => reviewProgress(state), [state]);\n  const selectedMeal = selectedMealId ? ALL_MEALS.find((meal) => meal.id === selectedMealId) ?? null : null;\n  const swapSource = swapMealId ? ALL_MEALS.find((meal) => meal.id === swapMealId) ?? null : null;\n',
              '  const progressReview = useMemo(() => reviewProgress(state), [state]);\n'
          )

          text = text.replace(
              '  function swapMeal(source: Meal, replacement: Meal) {\n    patch({ swappedMealIds: { ...state.swappedMealIds, [source.id]: replacement.id } });\n    setSwapMealId(null);\n  }',
              '  function swapMeal(sourceMealId: string, replacement: Meal) {\n    patch({ swappedMealIds: { ...state.swappedMealIds, [sourceMealId]: replacement.id } });\n    setSwapMealId(null);\n  }'
          )
          text = text.replace(
              '    const replacementId = state.swappedMealIds[item.meal.id];',
              '    const replacementId = state.swappedMealIds[item.sourceMealId];'
          )

          marker = '  const dayMeals = plannedMeals.map(effectiveMeal);\n'
          addition = "\n".join([
              '  const dayMeals = plannedMeals.map(effectiveMeal);',
              '  const selectedMeal = selectedMealId ? ALL_MEALS.find((meal) => meal.id === selectedMealId) ?? null : null;',
              '  const selectedPlannedMeal = selectedMealId ? dayMeals.find((item) => item.meal.id === selectedMealId) ?? null : null;',
              '  const swapPlannedMeal = swapMealId ? dayMeals.find((item) => item.sourceMealId === swapMealId) ?? null : null;',
              '  const swapSource = swapPlannedMeal?.meal ?? (swapMealId ? ALL_MEALS.find((meal) => meal.id === swapMealId) ?? null : null);',
              ''
          ])
          text = text.replace(marker, addition, 1)

          marker = '  function toggleMealEaten(id: string) {\n    patch({ eatenMealIds: state.eatenMealIds.includes(id) ? state.eatenMealIds.filter((item) => item !== id) : [...state.eatenMealIds, id] });\n  }\n'
          addition = "\n".join([
              '  function toggleMealEaten(id: string) {',
              '    patch({ eatenMealIds: state.eatenMealIds.includes(id) ? state.eatenMealIds.filter((item) => item !== id) : [...state.eatenMealIds, id] });',
              '  }',
              '',
              '  function updateMealPortion(sourceMealId: string, portion: MealPortion) {',
              '    patch({ mealPortionOverrides: { ...state.mealPortionOverrides, [sourceMealId]: portion } });',
              '  }',
              '',
              '  function rejectMeal(mealId: string) {',
              '    const swappedMealIds = Object.fromEntries(Object.entries(state.swappedMealIds).filter(([sourceId, replacementId]) => sourceId !== mealId && replacementId !== mealId));',
              '    patch({',
              '      rejectedMealIds: state.rejectedMealIds.includes(mealId) ? state.rejectedMealIds : [...state.rejectedMealIds, mealId],',
              '      swappedMealIds,',
              '      eatenMealIds: state.eatenMealIds.filter((item) => item !== mealId),',
              '    });',
              '    setSelectedMealId(null);',
              '    setSwapMealId(null);',
              '  }',
              '',
              '  function saveWeight(kg: number) {',
              '    const date = todayKey();',
              '    patch({ weightKg: kg, weightLog: [...state.weightLog.filter((point) => point.date !== date), { date, weight: kg }] });',
              '    setShowWeightLog(false);',
              '  }',
              ''
          ])
          text = text.replace(marker, addition, 1)

          text = text.replace(
              '<EatView state={state} targets={targets} meals={dayMeals} onMeal={(id) => setSelectedMealId(id)} onSwap={(id) => setSwapMealId(id)} toggleEaten={toggleMealEaten} showPrep={showPrep || state.showPrep} setShowPrep={setShowPrep} />',
              '<EatView state={state} targets={targets} meals={dayMeals} onMeal={(id) => setSelectedMealId(id)} onSwap={(id) => setSwapMealId(id)} toggleEaten={toggleMealEaten} updatePortion={updateMealPortion} rejectMeal={rejectMeal} showPrep={showPrep || state.showPrep} setShowPrep={setShowPrep} />'
          )
          text = text.replace(
              '<ProgressView state={state} review={progressReview} targets={targets} patch={patch} setTab={setTab} />',
              '<ProgressView state={state} review={progressReview} targets={targets} patch={patch} setTab={setTab} openWeightLog={() => setShowWeightLog(true)} openMonthlySummary={() => setShowMonthlySummary(true)} />'
          )

          text = text.replace(
              '{selectedMeal && <MealDetail meal={selectedMeal} state={state} close={() => setSelectedMealId(null)} swap={() => { setSelectedMealId(null); setSwapMealId(selectedMeal.id); }} toggleEaten={toggleMealEaten} />}',
              '{selectedMeal && <MealDetail meal={selectedMeal} state={state} close={() => setSelectedMealId(null)} swap={() => { setSelectedMealId(null); setSwapMealId(selectedPlannedMeal?.sourceMealId ?? selectedMeal.id); }} toggleEaten={toggleMealEaten} />}'
          )
          text = text.replace(
              '{swapSource && <MealSwap source={swapSource} state={state} ranked={rankedMeals.map((item) => item.meal)} close={() => setSwapMealId(null)} choose={(replacement) => swapMeal(swapSource, replacement)} />}',
              '{swapSource && swapMealId && <MealSwap source={swapSource} state={state} ranked={rankedMeals.map((item) => item.meal)} close={() => setSwapMealId(null)} choose={(replacement) => swapMeal(swapMealId, replacement)} />}'
          )
          text = text.replace(
              '{showProfile && <ProfileSheet state={state} targets={targets} patch={patch} close={() => setShowProfile(false)} reset={() => { localStorage.removeItem("start-here-state-v3"); setState(INITIAL_STATE); setStep(0); setShowProfile(false); }} />}',
              '{showProfile && <ProfileSheet state={state} targets={targets} patch={patch} close={() => setShowProfile(false)} reset={() => { localStorage.removeItem("start-here-state-v4"); localStorage.removeItem("start-here-state-v3"); setState(INITIAL_STATE); setStep(0); setShowProfile(false); }} />}\n      {showWeightLog && <WeightLogSheet currentKg={state.weightKg} onClose={() => setShowWeightLog(false)} onSave={saveWeight} />}\n      {showMonthlySummary && <MonthlySummarySheet state={state} onClose={() => setShowMonthlySummary(false)} />}'
          )

          old_today = '<div className="mt-4 space-y-2">{meals.slice(0, 3).map((item) => <button key={item.meal.id} onClick={() => onMeal(item.meal.id)} className="today-meal-row"><span className={cx("status-dot", state.eatenMealIds.includes(item.meal.id) && "status-done")}>{state.eatenMealIds.includes(item.meal.id) && <Icon name="check" size={12} />}</span><span className="min-w-0 flex-1 text-left"><strong>{item.meal.name}</strong><small>{item.protein}g protein · {item.meal.prepMinutes} min</small></span><button onClick={(event) => { event.stopPropagation(); onSwap(item.meal.id); }} className="row-action" aria-label="Swap"><Icon name="swap" size={16} /></button></button>)}</div>'
          new_today = '<div className="mt-4 space-y-2">{meals.slice(0, 3).map((item) => <TodayMealRow key={item.sourceMealId} item={item} eaten={state.eatenMealIds.includes(item.meal.id)} onOpen={() => onMeal(item.meal.id)} onSwap={() => onSwap(item.sourceMealId)} />)}</div>'
          if old_today not in text:
              raise SystemExit("Today meal row block not found")
          text = text.replace(old_today, new_today, 1)

          old_signature = 'function EatView({ state, targets, meals, onMeal, onSwap, toggleEaten, showPrep, setShowPrep }: { state: AppState; targets: ReturnType<typeof currentTargets>; meals: PlannedMeal[]; onMeal: (id: string) => void; onSwap: (id: string) => void; toggleEaten: (id: string) => void; showPrep: boolean; setShowPrep: (value: boolean) => void }) {'
          new_signature = 'function EatView({ state, targets, meals, onMeal, onSwap, toggleEaten, updatePortion, rejectMeal, showPrep, setShowPrep }: { state: AppState; targets: ReturnType<typeof currentTargets>; meals: PlannedMeal[]; onMeal: (id: string) => void; onSwap: (id: string) => void; toggleEaten: (id: string) => void; updatePortion: (sourceMealId: string, portion: MealPortion) => void; rejectMeal: (mealId: string) => void; showPrep: boolean; setShowPrep: (value: boolean) => void }) {'
          text = text.replace(old_signature, new_signature, 1)

          old_actions = '<div className="mt-3 flex gap-2"><button onClick={() => toggleEaten(item.meal.id)} className={cx("tiny-button", state.eatenMealIds.includes(item.meal.id) && "tiny-active")}><Icon name="check" size={13} />{state.eatenMealIds.includes(item.meal.id) ? "Logged" : "I ate this"}</button><button onClick={() => onSwap(item.meal.id)} className="tiny-button"><Icon name="swap" size={13} />Swap</button></div>'
          new_actions = '<div className="mt-3 flex flex-wrap gap-2"><button onClick={() => toggleEaten(item.meal.id)} className={cx("tiny-button", state.eatenMealIds.includes(item.meal.id) && "tiny-active")}><Icon name="check" size={13} />{state.eatenMealIds.includes(item.meal.id) ? "Logged" : "I ate this"}</button><button onClick={() => onSwap(item.sourceMealId)} className="tiny-button"><Icon name="swap" size={13} />Swap</button><button onClick={() => rejectMeal(item.meal.id)} className="tiny-button">Not for me</button></div><div className="mt-3"><MealPortionControl value={item.portion} onChange={(portion) => updatePortion(item.sourceMealId, portion)} /></div>'
          if old_actions not in text:
              raise SystemExit("Eat action block not found")
          text = text.replace(old_actions, new_actions, 1)

          old_progress_signature = 'function ProgressView({ state, review, targets, patch, setTab }: { state: AppState; review: ReturnType<typeof reviewProgress>; targets: ReturnType<typeof currentTargets>; patch: (update: Partial<AppState>) => void; setTab: (tab: AppTab) => void }) {'
          new_progress_signature = 'function ProgressView({ state, review, targets, patch, setTab, openWeightLog, openMonthlySummary }: { state: AppState; review: ReturnType<typeof reviewProgress>; targets: ReturnType<typeof currentTargets>; patch: (update: Partial<AppState>) => void; setTab: (tab: AppTab) => void; openWeightLog: () => void; openMonthlySummary: () => void }) {'
          text = text.replace(old_progress_signature, new_progress_signature, 1)

          old_log_function = '  function logWeight() {\n    const current = state.weightLog[state.weightLog.length - 1]?.weight ?? state.weightKg;\n    patch({ weightLog: [...state.weightLog, { date: todayKey(), weight: current }] });\n  }\n'
          text = text.replace(old_log_function, '', 1)
          text = text.replace('onClick={logWeight} className="soft-button"><Icon name="plus" size={14} /> Log weight', 'onClick={openWeightLog} className="soft-button"><Icon name="plus" size={14} /> Log weight', 1)

          metrics = '<div className="mt-3 grid grid-cols-2 gap-3"><MiniCard label="Training" value={`${workouts} workouts logged`} /><MiniCard label="Food" value={`${state.eatenMealIds.length} meals logged`} /><MiniCard label="Trend data" value={`${review.readings} readings`} /><MiniCard label="Current target" value={state.hideCalories ? "Calories hidden" : `${targets.calories} cal`} /></div>'
          metrics_new = metrics + '<button onClick={openMonthlySummary} className="coach-inline mt-3"><Icon name="calendar" size={18} /><span><strong>Monthly summary</strong><small>See the useful signals without a score.</small></span><Icon name="chevron" size={16} /></button>'
          text = text.replace(metrics, metrics_new, 1)

          path.write_text(text)

      - name: Commit feedback UI
        run: |
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add start-here/src/components/StartHereAppV2.tsx
          git commit -m "Add meal feedback and real progress logging UI"
          git push origin HEAD:start-here/lovable-transfer
