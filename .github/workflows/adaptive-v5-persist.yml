name: Persist adaptive week exceptions

on:
  push:
    branches: [adaptive-v5-week-exceptions]
    paths:
      - .github/workflows/adaptive-v5-persist.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-v5-week-exceptions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Fix explicit restore precedence
        run: python .github/scripts/v5_fix_restore_intent.py
      - name: Integrate week exceptions
        run: python .github/scripts/v5_integrate_week_exceptions.py
      - name: Install
        run: npm ci
      - name: Validate product
        run: |
          npm audit --omit=dev --audit-level=high
          npx eslint src/components/StartHereAppV2.tsx src/lib/startHereModels.ts src/lib/startHereWeek.ts src/lib/startHereWeekCoach.ts src/lib/startHereAdaptation.ts src/lib/startHereCoach.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts
          npm test
          npm run build
      - name: Commit product changes only
        run: |
          git config user.name "Squiggs07"
          git config user.email "160694990+Squiggs07@users.noreply.github.com"
          git add src/components/StartHereAppV2.tsx src/lib/startHereWeek.ts src/lib/startHereWeekCoach.ts src/lib/startHereAdaptation.ts src/lib/startHereCoach.ts src/lib/startHereAdaptation.test.ts
          git commit -m "Integrate week-only adaptive schedule changes"
          git push origin HEAD:adaptive-v5-week-exceptions
