name: Run adaptive v3 integration

on:
  push:
    branches: [adaptive-v3-weekly-plan]
    paths:
      - .github/workflows/adaptive-v3-run.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-v3-weekly-plan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Integrate weekly planning
        run: python .github/scripts/adaptive_v3_integrate.py
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint changed product code
        run: npx eslint src/components/StartHereAppV2.tsx src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereWeek.ts src/lib/startHereCoach.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated product changes
        run: |
          git config user.name "Squiggs07"
          git config user.email "160694990+Squiggs07@users.noreply.github.com"
          git add src/components/StartHereAppV2.tsx src/lib/startHerePlan.ts src/lib/startHereAdaptation.ts src/lib/startHereCoach.ts src/lib/startHereCoachClient.ts src/app/api/start-here-coach/route.ts src/lib/startHerePlan.test.ts src/lib/startHereAdaptation.test.ts
          git commit -m "Integrate adaptive weekly training plan"
          git push origin HEAD:adaptive-v3-weekly-plan
