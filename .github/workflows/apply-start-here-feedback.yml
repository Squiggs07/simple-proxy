name: Apply Start Here Feedback Pass

on:
  push:
    branches:
      - dev
    paths:
      - scripts/apply_start_here_feedback_pass.py
      - .github/workflows/apply-start-here-feedback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply source integration
        run: python scripts/apply_start_here_feedback_pass.py

      - name: Install AI Gateway SDK dependency
        run: |
          npm install ai@latest
          npm uninstall @anthropic-ai/sdk

      - name: Commit integrated pass
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add src package.json package-lock.json
          git commit -m "Integrate lifting baseline, meal controls, and intelligent Coach"
          git push origin HEAD:dev
