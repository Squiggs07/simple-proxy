name: Start Here Workout Integration

on:
  push:
    branches:
      - start-here/lovable-transfer

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-here/lovable-transfer

      - name: Integrate active workout component
        shell: python
        run: |
          from pathlib import Path
          path = Path("start-here/src/components/StartHereAppV2.tsx")
          text = path.read_text()

          react_import = 'import { FormEvent, ReactNode, useEffect, useMemo, useState } from "react";\n'
          active_import = 'import { ActiveWorkoutExperience } from "@/components/ActiveWorkoutExperience";\n'
          if active_import not in text:
              text = text.replace(react_import, react_import + active_import)

          text = text.replace('  const [setChecks, setSetChecks] = useState<Record<string, boolean[]>>({});\n', '')

          start = text.index('  function startWorkout() {')
          end = text.index('  function handleCoach', start)
          new_functions = '''  function startWorkout() {
    setActiveWorkout(true);
  }

  function finishWorkout(exercises: AppState["workoutLogs"][number]["exercises"]) {
    const log = {
      id: `workout-${Date.now()}`,
      date: todayKey(),
      workoutName: effectiveWorkout.name,
      minutes: effectiveWorkout.minutes,
      completed: true,
      exercises,
    };
    patch({ workoutLogs: [...state.workoutLogs, log], todayOverride: { minutes: null, equipment: null, note: null } });
    setActiveWorkout(false);
    setExerciseSwaps({});
  }

'''
          text = text[:start] + new_functions + text[end:]

          start = text.index('  if (activeWorkout) {')
          end = text.index('\n\n  return (', start)
          active_block = '''  if (activeWorkout) {
    return (
      <ActiveWorkoutExperience
        workout={effectiveWorkout}
        state={state}
        onClose={() => setActiveWorkout(false)}
        onFinish={finishWorkout}
        onSwap={(exerciseId, replacementId) => setExerciseSwaps((current) => ({ ...current, [exerciseId]: replacementId }))}
      />
    );
  }'''
          text = text[:start] + active_block + text[end:]

          marker = 'function ActiveWorkoutView('
          if marker in text:
              start = text.index(marker)
              end = text.index('function ProgressView(', start)
              text = text[:start] + text[end:]

          path.write_text(text)

      - name: Commit integration if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add start-here/src/components/StartHereAppV2.tsx
          git commit -m "Use full active workout logging experience"
          git push origin HEAD:start-here/lovable-transfer
