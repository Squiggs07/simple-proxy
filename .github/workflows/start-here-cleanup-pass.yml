name: Start Here Cleanup Pass

on:
  push:
    branches:
      - start-here/lovable-transfer

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-here/lovable-transfer

      - name: Tighten filters and remove dead code
        shell: python
        run: |
          from pathlib import Path

          plan = Path("start-here/src/lib/startHerePlan.ts")
          text = plan.read_text()
          text = text.replace(
              'const blocked = ["chicken", "turkey", "steak", "beef", "salmon", "fish", "egg", "dairy", "milk", "cheese", "whey"];',
              'const blocked = ["chicken", "turkey", "steak", "beef", "salmon", "fish", "egg", "greek yogurt", "cottage cheese", "skim milk", "cheddar", "parmesan", "whey"];'
          )
          plan.write_text(text)

          app = Path("start-here/src/components/StartHereAppV2.tsx")
          text = app.read_text()
          text = text.replace('const weekDays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];\n\n', '')
          old = "  const workout = useMemo<WorkoutPlan>(() => ({\n    ...baseWorkout,\n    exercises: baseWorkout.exercises.map((item) => {\n      const overrideId = exerciseSwaps[item.exercise.id];\n      if (!overrideId) return item;\n      const replacement = ALL_MEALS.length >= 0 ? undefined : undefined;\n      void replacement;\n      return item;\n    }),\n  }), [baseWorkout, exerciseSwaps]);\n\n"
          text = text.replace(old, '')
          text = text.replace('  void workout;\n\n', '')
          app.write_text(text)

      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add start-here/src/lib/startHerePlan.ts start-here/src/components/StartHereAppV2.tsx
          git commit -m "Tighten dietary filtering and remove dead app code"
          git push origin HEAD:start-here/lovable-transfer
