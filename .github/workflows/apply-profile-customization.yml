name: Apply Profile Customization

on:
  push:
    branches:
      - dev
    paths:
      - scripts/add_profile_customization.py
      - .github/workflows/apply-profile-customization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - run: python scripts/add_profile_customization.py
      - name: Commit profile controls
        run: |
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/StartHereAppV2.tsx
          git commit -m "Expose lifting baseline and food direction in profile"
          git push origin HEAD:dev
