name: Start Here React Lint Fix

on:
  push:
    branches:
      - start-here/lovable-transfer

permissions:
  contents: write

jobs:
  fix-react-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: start-here/lovable-transfer

      - name: Fix React effect state usage
        shell: python
        run: |
          from pathlib import Path

          app = Path("start-here/src/components/StartHereAppV2.tsx")
          text = app.read_text()
          old = "\n".join([
              '  useEffect(() => {',
              '    try {',
              '      const saved = localStorage.getItem("start-here-state-v3");',
              '      if (saved) setState(mergeStoredState(JSON.parse(saved)));',
              '    } catch {',
              '      setState(INITIAL_STATE);',
              '    } finally {',
              '      setReady(true);',
              '    }',
              '  }, []);'
          ])
          new = "\n".join([
              '  useEffect(() => {',
              '    const timer = window.setTimeout(() => {',
              '      try {',
              '        const saved = localStorage.getItem("start-here-state-v3");',
              '        if (saved) setState(mergeStoredState(JSON.parse(saved)));',
              '      } catch {',
              '        setState(INITIAL_STATE);',
              '      } finally {',
              '        setReady(true);',
              '      }',
              '    }, 0);',
              '    return () => window.clearTimeout(timer);',
              '  }, []);'
          ])
          if old not in text:
              raise SystemExit("StartHereAppV2 hydration block not found")
          app.write_text(text.replace(old, new, 1))

          workout = Path("start-here/src/components/ActiveWorkoutExperience.tsx")
          text = workout.read_text()
          first = text.index('  useEffect(() => {')
          second = text.index('  useEffect(() => {', first + 1)
          text = text[:first] + text[second:]
          workout.write_text(text)

      - name: Commit lint fixes
        run: |
          git config user.name "Start Here CI"
          git config user.email "actions@users.noreply.github.com"
          git add start-here/src/components/StartHereAppV2.tsx start-here/src/components/ActiveWorkoutExperience.tsx
          git commit -m "Fix Start Here React state synchronization"
          git push origin HEAD:start-here/lovable-transfer
